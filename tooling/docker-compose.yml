# Profitily AI — local infrastructure (all OSS, zero paid accounts).
# Up (core):   pnpm infra:up      → postgres, valkey, minio (+bucket), mailpit
# Up (+AI):    pnpm infra:up:ai   → also starts ollama (profile "ai")
# Down:        pnpm infra:down
# Smoke check: pnpm smoke
#
# Credentials below are LOCAL-ONLY dev defaults and intentionally match
# .env.example. Never reuse them outside local development. Real secrets live in
# .env (git-ignored) / the per-environment secret store (docs/13 §5).

name: profitily

services:
  # ── Postgres + TimescaleDB (transactional truth + time-series) ──
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: profitily
      POSTGRES_PASSWORD: profitily
      POSTGRES_DB: profitily
    # Host port is overridable (default 5432) so this stack can run alongside
    # another local Postgres; the container port stays canonical. See README.
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profitily -d profitily"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Valkey (OSS Redis fork) — cache + BullMQ backend ──
  valkey:
    image: valkey/valkey:8.0.2-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── MinIO (S3-compatible object storage) ──
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── One-shot: create the reports bucket, then exit ──
  # Behind the "init" profile so `up --wait` doesn't track this short-lived
  # container; `pnpm infra:up` runs it via `compose run --rm` after MinIO is up.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/profitily-reports &&
        echo "bucket profitily-reports ready"

  # ── Mailpit (local SMTP capture) ──
  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Ollama (local AI) — opt-in, only needed from the AI phase onward ──
  ollama:
    image: ollama/ollama:0.6.8
    profiles: ["ai"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  valkeydata:
  miniodata:
  ollamadata:
