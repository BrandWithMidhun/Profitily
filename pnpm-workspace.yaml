packages:
  - "apps/*"
  - "packages/*"

# Security overrides — force patched transitive versions (CI `pnpm audit` gate).
# multer: @nestjs/platform-express@11 pins 2.1.1, vulnerable to a DoS
# (GHSA-72gw-mp4g-v24j, HIGH). 2.2.0 is the same-major security patch; no
# file-upload code uses multer yet, so the bump is low-risk. Revisit when NestJS
# bumps its own pin.
overrides:
  multer: 2.2.0
  # esbuild <0.28.1: low, dev-only serve-mode CORS issue (GHSA-g7r4-m6w7-qqqr).
  # Dedupe the transitive 0.27.7 up to the patched line (we never use esbuild serve).
  esbuild: "^0.28.1"
  # file-type <21.3.2: MEDIUM (GHSA-5v7r-6r5c-r473, GHSA-j47w-4g3g-c36v). The
  # vulnerable 20.5.0 is build-time only (via @swc/cli's @xhmikosr binary-download
  # chain); the runtime already uses the patched 21.3.4 (via @nestjs/common). Dedupe
  # the build-time copy up to the patched line too.
  file-type: "^21.3.2"
  # postcss <8.5.10: MEDIUM (GHSA-qx2v-qp2m-jg93). Transitive (Next/Tailwind build
  # tooling); 8.5.10 is a same-major, API-stable minor. Dedupe to the patched line.
  postcss: "^8.5.10"
  # qs <6.15.2: MEDIUM (GHSA-q8mj-m7cp-5q26). Transitive (express/test tooling);
  # 6.15.2 is a same-line patch. Dedupe to the patched version.
  qs: "^6.15.2"

# Allowlist for dependency build (postinstall) scripts — kept minimal and explicit.
# esbuild/@swc/core fetch platform-native binaries (Vitest / NestJS transpile);
# the Prisma packages download/build their query engine and generate the client;
# protobufjs is an OpenTelemetry transitive dependency; sharp fetches its native
# binary for Next.js image optimization (apps/web / apps/shopify-app).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  # ssh2 + cpu-features are optional native crypto/SSH accelerators pulled by
  # testcontainers' dockerode. We connect to Docker over the local socket/npipe (not
  # SSH), and ssh2 has a pure-JS fallback — so these native builds are NOT needed.
  cpu-features: false
  ssh2: false
